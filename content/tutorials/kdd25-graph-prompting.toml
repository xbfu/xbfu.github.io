title = "Graph Prompting for Graph Learning Models: Recent Advances and Future Directions"
event = "KDD 2025 Tutorial"
time = "Monday, August 4, 2025, 1–4 PM"
location = "Toronto Convention Centre, Toronto, Canada"
logo = "/tutorials/kdd-2025-logo.png"
survey_url = "https://arxiv.org/abs/2506.08326"
slides_url = "/tutorials/Graph%20Prompting%20%28KDD%20tutorial%29.pdf"
abstract = """
Graph learning models have demonstrated great prowess in learning expressive representations from large-scale graph data in a wide variety of real-world scenarios. As a prevalent strategy for training powerful graph learning models, the "pre-training, adaptation" scheme first pre-trains graph learning models on unlabeled graph data in a self-supervised manner and then adapts them to specific downstream tasks. During the adaptation phase, graph prompting emerges as a promising approach that learns trainable prompts while keeping the pre-trained graph learning models unchanged. This tutorial will cover recent advancements in graph prompting including:
"""
topics = [
  "Representative graph pre-training methods that serve as the foundation step of graph prompting",
  "Mainstream techniques in graph prompting and elaborate on how they design learnable prompts for graph prompting",
  "Real-world applications of graph prompting from different domains",
  "Open challenges in existing studies with promising future directions in this field"
]

